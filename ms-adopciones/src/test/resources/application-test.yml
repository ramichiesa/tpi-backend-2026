spring:
  datasource:
    url: jdbc:h2:mem:adopciones;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS adopciones
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        hbm2ddl:
          create_namespaces: true

adopciones:
  politica:
    periodo-adaptacion-dias: 30
  tareas:
    # En las pruebas la tarea se invoca a mano para controlar el momento
    habilitadas: false
