spring:
  datasource:
    url: jdbc:h2:mem:animales;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;INIT=CREATE SCHEMA IF NOT EXISTS animales
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        # H2 no tiene el esquema "animales" creado por el script de PostgreSQL: lo crea Hibernate
        hbm2ddl:
          create_namespaces: true

animales:
  datos-demo: false
